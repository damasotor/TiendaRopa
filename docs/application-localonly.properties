# Configuración MongoDB LOCAL FORZADA
spring.data.mongodb.uri=mongodb://localhost:27017/tiendaropa

# Deshabilitar cualquier configuración automática problemática
spring.data.mongodb.auto-index-creation=false

# Forzar configuración local
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.embedded.EmbeddedMongoAutoConfiguration

# Sin autenticación para local
spring.data.mongodb.username=
spring.data.mongodb.password=
spring.data.mongodb.authentication-database=

# Logging detallado para debugging
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.ropa.tienda=DEBUG
logging.level.org.mongodb.driver=DEBUG

# Server local
server.port=8080