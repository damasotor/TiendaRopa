# MongoDB Local connection (forced to localhost)
# Configuración forzada para usar MongoDB local en localhost
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=tienda_ropa

# Comentamos la URI que estaba causando problemas
# spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/tienda_ropa}

# Logging
logging.level.org.springframework.data.mongodb=DEBUG

# Server
server.port=8080

# Spring Boot configuration  
spring.main.allow-bean-definition-overriding=true

# Devtools
# Enable automatic restart for better development experience
spring.devtools.restart.enabled=true