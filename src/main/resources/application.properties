# MongoDB Atlas connection
# RECOMENDACIÓN: no commitear credenciales en el repo. Use variable de entorno en producción.
# Puedes definir la URI completa en la variable de entorno SPRING_DATA_MONGODB_URI
# Ejemplo de URI (rellena usuario y contraseña):
# mongodb+srv://<usuario>:<password>@cluster0.idxixc5.mongodb.net/tienda_ropa?retryWrites=true&w=majority

# Si SPRING_DATA_MONGODB_URI está presente, Spring Boot la usará automáticamente.
# Para desarrollo local puedes descomentar y completar la línea siguiente (NO recomendado para repos públicos):
# spring.data.mongodb.uri=mongodb+srv://<usuario>:<password>@cluster0.idxixc5.mongodb.net/tienda_ropa?retryWrites=true&w=majority

# Opcional: fallback a MongoDB local si no usas Atlas
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=tienda_ropa

# Logging
logging.level.org.springframework.data.mongodb=DEBUG

# Server
server.port=8080

# Devtools
spring.devtools.restart.enabled=true