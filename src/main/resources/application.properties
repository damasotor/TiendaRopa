# ===========================================
# CONFIGURACIÓN MONGODB LOCAL ÚNICAMENTE
# ===========================================
spring.data.mongodb.uri=mongodb://localhost:27017/tiendaropa

# Deshabilitar configuración automática de índices para evitar conflictos
spring.data.mongodb.auto-index-creation=false

# Configuración del servidor
server.port=8080

# Logging básico
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.ropa.tienda=INFO