<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiendaRopa - E-commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Verificar autenticación al cargar la página
        window.addEventListener('load', function() {
            const token = localStorage.getItem('jwt-token');
            if (!token) {
                // Redireccionar al login si no hay token
                window.location.href = '/login.html';
                return;
            }
            // Verificar si el token es válido
            verifyToken(token);
        });

        function verifyToken(token) {
            fetch('/api/auth/verify', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Token inválido');
                }
            })
            .then(data => {
                // Token válido, mostrar información del usuario
                displayUserInfo(data);
            })
            .catch(error => {
                console.error('Error verificando token:', error);
                localStorage.removeItem('jwt-token');
                localStorage.removeItem('userRole');
                window.location.href = '/login.html';
            });
        }

        function displayUserInfo(userData) {
            const userInfoElement = document.getElementById('user-info');
            const adminLinkElement = document.getElementById('admin-link');
            const loginBtnElement = document.getElementById('loginBtn');
            
            if (userInfoElement) {
                userInfoElement.innerHTML = `
                    <span class="text-sm text-gray-600">Bienvenido: ${userData.email}</span>
                    <button onclick="logout()" class="ml-4 text-sm text-red-600 hover:text-red-800">Cerrar Sesión</button>
                `;
            }

            // Ocultar botón de login cuando el usuario está autenticado
            if (loginBtnElement) {
                loginBtnElement.style.display = 'none';
            }

            // Mostrar enlace de admin solo si es administrador
            if (userData.rol === 'ROLE_ADMIN' && adminLinkElement) {
                adminLinkElement.style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('jwt-token');
            localStorage.removeItem('userRole');
            window.location.href = '/login.html';
        }

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .carrito-badge {
            transform: scale(0.8);
        }
    </style>
</head>
<body class="bg-gray-50">

<!-- Header -->
<header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <div class="flex items-center">
                <h1 class="text-2xl font-bold text-gray-900">👔 TiendaRopa</h1>
            </div>

            <!-- Navegación -->
            <nav class="hidden md:flex space-x-8">
                <a href="#" onclick="mostrarProductos()" class="text-gray-500 hover:text-gray-900">Productos</a>
                <a href="#" onclick="mostrarOrdenes()" class="text-gray-500 hover:text-gray-900">Órdenes</a>
                <a id="admin-link" href="/admin.html" class="text-red-600 hover:text-red-800" style="display: none;">Panel Admin</a>
            </nav>

            <!-- Información de usuario y Carrito -->
            <div class="flex items-center space-x-4">
                <div id="user-info" class="text-sm">
                    <!-- La información del usuario se cargará aquí -->
                </div>
                <button id="carritoBtn" class="relative p-2 text-gray-500 hover:text-gray-900">
                    🛒
                    <span id="carritoBadge" class="carrito-badge absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
                </button>
                <button id="loginBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                    Iniciar Sesión
                </button>
            </div>
        </div>
    </div>
</header>

<!-- Filtros -->
<section id="filtrosSeccion" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold mb-4">Filtros</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <!-- Categoría -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Categoría</label>
                <select id="categoriaFiltro" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                    <option value="">Todas las categorías</option>
                    <option value="camisas">Camisas</option>
                    <option value="pantalones">Pantalones</option>
                    <option value="zapatos">Zapatos</option>
                    <option value="accesorios">Accesorios</option>
                </select>
            </div>

            <!-- Color -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Color</label>
                <select id="colorFiltro" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                    <option value="">Todos los colores</option>
                    <option value="rojo">Rojo</option>
                    <option value="azul">Azul</option>
                    <option value="negro">Negro</option>
                    <option value="blanco">Blanco</option>
                </select>
            </div>

            <!-- Precio -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Precio máximo</label>
                <input type="number" id="precioMax" placeholder="$ 0" class="w-full border border-gray-300 rounded-lg px-3 py-2">
            </div>

            <!-- Sucursal -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Sucursal</label>
                <select id="sucursalFiltro" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                    <option value="">Todas las sucursales</option>
                </select>
            </div>
        </div>

        <div class="mt-4 flex space-x-4">
            <button id="aplicarFiltros" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                Aplicar Filtros
            </button>
            <button id="limpiarFiltros" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400">
                Limpiar Filtros
            </button>
        </div>
    </div>
</section>

<!-- Productos -->
<section id="productos" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Productos</h2>
        <div id="resultadosInfo" class="text-gray-600"></div>
    </div>

    <!-- Grid de productos -->
    <div id="productosGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Los productos se cargarán dinámicamente aquí -->
    </div>

    <!-- Mensaje cuando no hay resultados -->
    <div id="sinResultados" class="text-center py-12 hidden">
        <p class="text-gray-500 text-lg">No se encontraron artículos que coincidan con los filtros seleccionados.</p>
    </div>
</section>

<!-- Órdenes -->
<section id="ordenes" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6" style="display: none;">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Mis Órdenes</h2>
    </div>

    <!-- Lista de órdenes -->
    <div id="ordenesLista" class="space-y-4">
        <!-- Las órdenes se cargarán dinámicamente aquí -->
    </div>

    <!-- Mensaje cuando no hay órdenes -->
    <div id="sinOrdenes" class="text-center py-12 hidden">
        <p class="text-gray-500 text-lg">No tienes órdenes realizadas aún.</p>
    </div>
</section>

<!-- Modal del Carrito -->
<div id="carritoModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
    <div class="absolute right-0 top-0 h-full w-96 bg-white shadow-xl">
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold">Tu Carrito</h3>
                <button id="cerrarCarrito" class="text-gray-500 hover:text-gray-700">✕</button>
            </div>
            
            <div id="carritoItems" class="space-y-4 max-h-96 overflow-y-auto">
                <!-- Items del carrito se cargarán aquí -->
            </div>
            
            <div class="mt-6 pt-4 border-t">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-lg font-semibold">Total:</span>
                    <span id="carritoTotal" class="text-lg font-bold text-blue-600">$0</span>
                </div>
                <button id="finalizarCompra" onclick="finalizarCompra()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700">
                    Finalizar Compra
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api';
    
    // Función para obtener visitanteId
    function getVisitanteId() {
        const token = localStorage.getItem('jwt-token');
        if (token) {
            try {
                // Si el usuario está logueado, usar su email como visitanteId
                const payload = JSON.parse(atob(token.split('.')[1]));
                return payload.sub; // El email está en el 'sub' del JWT
            } catch (error) {
                console.error('Error decodificando token:', error);
            }
        }
        // Si no está logueado, usar un ID temporal
        return localStorage.getItem('visitanteId') || 'visitante_' + Date.now();
    }
    
    let visitanteId = getVisitanteId();
    let carrito = { items: [], total: 0 };
    let productos = [];
    let sucursales = [];

    // Guardar visitante ID en localStorage solo si no está logueado
    if (!localStorage.getItem('jwt-token')) {
        localStorage.setItem('visitanteId', visitanteId);
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', function() {
        // Mostrar sección de productos y filtros por defecto
        document.getElementById('productos').style.display = 'block';
        document.getElementById('filtrosSeccion').style.display = 'block';
        document.getElementById('ordenes').style.display = 'none';
        
        cargarSucursales();
        cargarProductos();
        cargarCarrito();
        
        // Event listeners
        document.getElementById('aplicarFiltros').addEventListener('click', aplicarFiltros);
        document.getElementById('limpiarFiltros').addEventListener('click', limpiarFiltros);
        document.getElementById('carritoBtn').addEventListener('click', mostrarCarrito);
        document.getElementById('cerrarCarrito').addEventListener('click', ocultarCarrito);
        document.getElementById('loginBtn').addEventListener('click', () => {
            window.location.href = 'login.html';
        });
    });

    // Cargar sucursales
    async function cargarSucursales() {
        try {
            const response = await fetch(`${API_URL}/sucursales`);
            if (response.ok) {
                sucursales = await response.json();
                const select = document.getElementById('sucursalFiltro');
                sucursales.forEach(sucursal => {
                    const option = document.createElement('option');
                    option.value = sucursal.id;
                    option.textContent = sucursal.nombre;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Error cargando sucursales:', error);
        }
    }

    // Cargar productos
    async function cargarProductos() {
        try {
            const response = await fetch(`${API_URL}/productos`);
            if (response.ok) {
                productos = await response.json();
                mostrarProductosEnGrid(productos);
            } else {
                console.error('Error en respuesta del servidor:', response.status);
            }
        } catch (error) {
            console.error('Error cargando productos:', error);
        }
    }

    // Mostrar productos en el grid
    function mostrarProductosEnGrid(productosLista) {
        const grid = document.getElementById('productosGrid');
        const sinResultados = document.getElementById('sinResultados');
        const resultadosInfo = document.getElementById('resultadosInfo');
        
        if (productosLista.length === 0) {
            grid.innerHTML = '';
            sinResultados.classList.remove('hidden');
            resultadosInfo.textContent = '';
        } else {
            sinResultados.classList.add('hidden');
            resultadosInfo.textContent = `${productosLista.length} productos encontrados`;
            
            grid.innerHTML = productosLista.map(producto => `
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="h-48 bg-gray-200 flex items-center justify-center">
                        ${producto.imagenes && producto.imagenes.length > 0 
                            ? `<img src="${producto.imagenes[0]}" alt="${producto.nombre}" class="w-full h-full object-cover">`
                            : '<span class="text-gray-400">Sin imagen</span>'
                        }
                    </div>
                    <div class="p-4">
                        <h3 class="font-semibold text-gray-900 mb-2">${producto.nombre}</h3>
                        <p class="text-gray-600 text-sm mb-2">${producto.descripcion || ''}</p>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-lg font-bold text-blue-600">$${producto.precio}</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <label class="text-sm text-gray-700">Cantidad:</label>
                            <input type="number" id="cantidad-${producto.id}" value="1" min="1" max="10" 
                                   class="w-16 px-2 py-1 border border-gray-300 rounded text-sm">
                            <button onclick="agregarAlCarrito('${producto.id}')" 
                                    class="flex-1 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                                Agregar
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    }

    // Aplicar filtros usando CU-001
    async function aplicarFiltros() {
        const categoria = document.getElementById('categoriaFiltro').value;
        const color = document.getElementById('colorFiltro').value;
        const precioMax = document.getElementById('precioMax').value;
        const sucursal = document.getElementById('sucursalFiltro').value;

        const filtros = {
            atributos: {},
            sucursales: [],
            stockMinimo: 1
        };

        if (categoria) filtros.categoria = categoria;
        if (color) filtros.atributos.color = color;
        if (precioMax) filtros.precioMax = parseFloat(precioMax);
        if (sucursal) filtros.sucursales = [sucursal];

        try {
            const response = await fetch(`${API_URL}/productos/filtrar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(filtros)
            });

            if (response.ok) {
                const productosFiltrados = await response.json();
                mostrarProductosEnGrid(productosFiltrados);
            } else {
                console.error('Error en la respuesta:', response.status);
            }
        } catch (error) {
            console.error('Error aplicando filtros:', error);
        }
    }

    // Limpiar filtros
    function limpiarFiltros() {
        document.getElementById('categoriaFiltro').value = '';
        document.getElementById('colorFiltro').value = '';
        document.getElementById('precioMax').value = '';
        document.getElementById('sucursalFiltro').value = '';
        mostrarProductosEnGrid(productos);
    }

    // Agregar producto al carrito usando CU-002
    async function agregarAlCarrito(productoId) {
        // Obtener la cantidad seleccionada
        const cantidadInput = document.getElementById(`cantidad-${productoId}`);
        const cantidad = cantidadInput ? parseInt(cantidadInput.value) : 1;
        
        // Validar cantidad
        if (cantidad < 1 || cantidad > 10) {
            alert('La cantidad debe estar entre 1 y 10');
            return;
        }
        
        // Obtener el token para autenticación
        const token = localStorage.getItem('jwt-token');
        const headers = {
            'Content-Type': 'application/json'
        };
        
        // Agregar token si está disponible
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
        
        try {
            const response = await fetch(`${API_URL}/carrito/${visitanteId}/items`, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    articuloId: productoId,
                    cantidad: cantidad
                })
            });

            if (response.ok) {
                carrito = await response.json();
                actualizarBadgeCarrito();
                // Mostrar notificación
                alert(`${cantidad} producto(s) agregado(s) al carrito`);
                // Resetear cantidad a 1
                if (cantidadInput) {
                    cantidadInput.value = 1;
                }
            } else {
                console.error('Error al agregar al carrito:', response.status);
                const errorText = await response.text();
                console.error('Detalles del error:', errorText);
            }
        } catch (error) {
            console.error('Error agregando al carrito:', error);
        }
    }

    // Cargar carrito
    async function cargarCarrito() {
        // Obtener el token para autenticación
        const token = localStorage.getItem('jwt-token');
        const headers = {};
        
        // Agregar token si está disponible
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
        
        try {
            const response = await fetch(`${API_URL}/carrito/${visitanteId}`, {
                headers: headers
            });
            if (response.ok) {
                carrito = await response.json();
                actualizarBadgeCarrito();
            }
        } catch (error) {
            console.error('Error cargando carrito:', error);
        }
    }

    // Actualizar badge del carrito
    function actualizarBadgeCarrito() {
        const badge = document.getElementById('carritoBadge');
        const cantidad = carrito.items.reduce((total, item) => total + item.cantidad, 0);
        
        if (cantidad > 0) {
            badge.textContent = cantidad;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }

    // Mostrar modal del carrito
    async function mostrarCarrito() {
        document.getElementById('carritoModal').classList.remove('hidden');
        // Cargar el carrito más reciente antes de mostrarlo
        await cargarCarrito();
        actualizarVistaCarrito();
    }

    // Ocultar modal del carrito
    function ocultarCarrito() {
        document.getElementById('carritoModal').classList.add('hidden');
    }

    // Actualizar vista del carrito
    function actualizarVistaCarrito() {
        const carritoItems = document.getElementById('carritoItems');
        const carritoTotal = document.getElementById('carritoTotal');
        
        if (!carrito || !carrito.items || carrito.items.length === 0) {
            carritoItems.innerHTML = '<p class="text-gray-500">Tu carrito está vacío</p>';
        } else {
            carritoItems.innerHTML = carrito.items.map((item, index) => {
                // Ahora articuloId debería ser un string directo
                const articuloIdStr = item.articuloId;
                
                // Buscar producto por ID
                const producto = productos.find(p => p.id === articuloIdStr);
                
                const nombreProducto = producto ? producto.nombre : `Producto no encontrado (ID: ${articuloIdStr})`;
                
                return `
                    <div class="flex justify-between items-center p-3 border rounded mb-2">
                        <div class="flex-1">
                            <h4 class="font-medium text-gray-900">${nombreProducto}</h4>
                            <p class="text-sm text-gray-600">Cantidad: ${item.cantidad}</p>
                            <p class="text-sm text-gray-600">$${item.precioUnitario} c/u</p>
                        </div>
                        <div class="text-right">
                            <p class="font-semibold text-lg">$${item.subtotal}</p>
                            <button onclick="eliminarDelCarrito('${articuloIdStr}')" 
                                    class="bg-red-600 text-white px-2 py-1 rounded text-sm hover:bg-red-700 mt-1">
                                Eliminar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        carritoTotal.textContent = carrito && carrito.total ? `$${carrito.total}` : '$0';
    }

    // Eliminar del carrito
    async function eliminarDelCarrito(articuloId) {
        if (!confirm('¿Estás seguro de que quieres eliminar este producto del carrito?')) {
            return;
        }
        
        // Obtener el token para autenticación
        const token = localStorage.getItem('jwt-token');
        const headers = {
            'Content-Type': 'application/json'
        };
        
        // Agregar token si está disponible
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
        
        try {
            const response = await fetch(`${API_URL}/carrito/${visitanteId}/items`, {
                method: 'DELETE',
                headers: headers,
                body: JSON.stringify({
                    articuloId: articuloId
                })
            });

            if (response.ok) {
                carrito = await response.json();
                actualizarBadgeCarrito();
                actualizarVistaCarrito();
                alert('Producto eliminado del carrito');
            } else {
                const errorText = await response.text();
                console.error('Error al eliminar del carrito:', response.status, errorText);
                alert('Error al eliminar el producto del carrito');
            }
        } catch (error) {
            console.error('Error eliminando del carrito:', error);
            alert('Error de conexión al eliminar del carrito');
        }
    }

    // Función para extraer ID de ObjectId o string
    function extraerIdOrden(id) {
        if (!id) return 'N/A';
        
        // Si ya es un string, devolverlo directamente
        if (typeof id === 'string') {
            return id;
        }
        
        // Si es un objeto, intentar extraer el ID
        if (typeof id === 'object') {
            // Prioridad: $oid, luego _bsontype, luego timestamp
            if (id.$oid) return id.$oid;
            if (id.timestamp) {
                // Convertir timestamp a hexadecimal (estilo ObjectId)
                return id.timestamp.toString(16).padStart(8, '0') + 
                       Math.random().toString(16).substring(2, 10);
            }
            // Como último recurso, usar JSON.stringify y extraer hash
            const str = JSON.stringify(id);
            return btoa(str).substring(0, 8); // Base64 de los primeros caracteres
        }
        
        // Fallback final
        return String(id).substring(0, 8) || 'TEMP';
    }

    // Función para mostrar la sección de órdenes
    function mostrarOrdenes() {
        // Ocultar la sección de productos y filtros
        document.getElementById('productos').style.display = 'none';
        document.getElementById('filtrosSeccion').style.display = 'none';
        // Mostrar la sección de órdenes
        document.getElementById('ordenes').style.display = 'block';
        // Cargar las órdenes del usuario
        cargarOrdenes();
    }

    // Función para mostrar la sección de productos
    function mostrarProductos() {
        // Mostrar la sección de productos y filtros
        document.getElementById('productos').style.display = 'block';
        document.getElementById('filtrosSeccion').style.display = 'block';
        // Ocultar la sección de órdenes
        document.getElementById('ordenes').style.display = 'none';
        
        // Asegurar que los productos estén cargados y mostrados
        if (productos.length === 0) {
            cargarProductos();
        } else {
            mostrarProductosEnGrid(productos);
        }
    }

    // Función para cargar las órdenes del usuario
    async function cargarOrdenes() {
        try {
            const token = localStorage.getItem('jwt-token');
            const response = await fetch('/api/ordenes/mis-ordenes', {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const ordenes = await response.json();
                mostrarOrdenesEnUI(ordenes);
            } else {
                console.error('Error al cargar órdenes:', response.status);
                document.getElementById('sinOrdenes').classList.remove('hidden');
            }
        } catch (error) {
            console.error('Error cargando órdenes:', error);
            document.getElementById('sinOrdenes').classList.remove('hidden');
        }
    }

    // Función para mostrar las órdenes en la UI
    function mostrarOrdenesEnUI(ordenes) {
        const ordenesLista = document.getElementById('ordenesLista');
        const sinOrdenes = document.getElementById('sinOrdenes');

        if (!ordenes || ordenes.length === 0) {
            sinOrdenes.classList.remove('hidden');
            ordenesLista.innerHTML = '';
            return;
        }

        sinOrdenes.classList.add('hidden');

        ordenesLista.innerHTML = ordenes.map(orden => {
            const fecha = new Date(orden.fechaPedido).toLocaleDateString();
            const estado = orden.estado;
            const estadoColor = getEstadoColor(estado);
            
            // Usar la función para extraer el ID correctamente
            const ordenId = extraerIdOrden(orden.id);

            return `
                <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-900">Orden #${ordenId}</h3>
                            <p class="text-sm text-gray-600">Fecha: ${fecha}</p>
                        </div>
                        <div>
                            <span class="px-3 py-1 rounded-full text-sm font-medium ${estadoColor}">
                                ${estado.charAt(0).toUpperCase() + estado.slice(1)}
                            </span>
                            <p class="text-lg font-bold text-gray-900 mt-1">$${orden.total}</p>
                        </div>
                    </div>
                    
                    <div class="border-t pt-4">
                        <h4 class="font-medium text-gray-900 mb-2">Productos:</h4>
                        <div class="space-y-2">
                            ${orden.items.map(item => {
                                const producto = productos.find(p => p.id === item.articuloId);
                                const nombreProducto = producto ? producto.nombre : 'Producto no encontrado';
                                return `
                                    <div class="flex justify-between text-sm">
                                        <span>${nombreProducto} (x${item.cantidad})</span>
                                        <span>$${item.subtotal}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    
                    ${orden.direccionEnvio ? `
                        <div class="border-t pt-4 mt-4">
                            <h4 class="font-medium text-gray-900 mb-2">Dirección de envío:</h4>
                            <p class="text-sm text-gray-600">
                                ${orden.direccionEnvio.calle}, ${orden.direccionEnvio.ciudad}
                            </p>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    // Función para obtener el color del estado
    function getEstadoColor(estado) {
        switch (estado) {
            case 'pendiente':
                return 'bg-yellow-100 text-yellow-800';
            case 'procesando':
                return 'bg-blue-100 text-blue-800';
            case 'enviado':
                return 'bg-purple-100 text-purple-800';
            case 'entregado':
                return 'bg-green-100 text-green-800';
            case 'cancelado':
                return 'bg-red-100 text-red-800';
            default:
                return 'bg-gray-100 text-gray-800';
        }
    }

    // Función para finalizar compra
    async function finalizarCompra() {
        try {
            const token = localStorage.getItem('jwt-token');
            
            // Obtener el email del usuario desde el token JWT
            const payload = JSON.parse(atob(token.split('.')[1]));
            const userEmail = payload.sub; // El email está en el 'sub' del JWT
            
            // Crear la orden a partir del carrito
            const ordenData = {
                visitanteId: userEmail, // Usar email como visitanteId
                metodoPago: 'tarjeta', // Por ahora fijo, se puede hacer dinámico
                sucursalId: null, // null para envío a domicilio
                direccionEnvio: {
                    calle: 'Dirección por defecto',
                    ciudad: 'Ciudad por defecto',
                    codigoPostal: '00000'
                }
            };

            const response = await fetch('/api/ordenes', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(ordenData)
            });

            if (response.ok) {
                const orden = await response.json();
                console.log('Orden recibida:', orden);
                
                // Usar la función para extraer el ID correctamente
                const ordenId = extraerIdOrden(orden.id);
                alert('¡Compra realizada exitosamente! Orden #' + ordenId);
                
                // Limpiar carrito local inmediatamente
                try {
                    carrito = { items: [], total: 0 };
                    actualizarBadgeCarrito();
                    actualizarVistaCarrito();
                    ocultarCarrito();
                    console.log('Compra finalizada exitosamente');
                } catch (cleanupError) {
                    console.error('Error limpiando carrito:', cleanupError);
                    // No mostrar error al usuario, ya que la compra fue exitosa
                }
            } else {
                const errorText = await response.text();
                console.error('Error al finalizar compra:', response.status, errorText);
                alert('Error al procesar la compra. Por favor, intenta nuevamente.');
            }
        } catch (error) {
            console.error('Error finalizando compra:', error);
            alert('Error de conexión al procesar la compra');
        }
    }

    // Click fuera del modal para cerrarlo
    document.getElementById('carritoModal').addEventListener('click', function(e) {
        if (e.target === this) {
            ocultarCarrito();
        }
    });
</script>
