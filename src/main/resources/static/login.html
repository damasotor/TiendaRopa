<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TiendaRopa</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Estilo para que el fondo se vea bien */
        body {
            background-color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gray-50">

<div class="w-full max-w-md p-8 space-y-6 bg-white shadow-xl rounded-xl border border-gray-200">
    <h1 class="text-3xl font-extrabold text-center text-gray-900">TiendaRopa</h1>
    <p class="text-center text-sm text-gray-600">Ingresa tus credenciales para continuar.</p>

    <form id="loginForm" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="email" required placeholder="Ingresa tu email"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" id="password" required placeholder="Ingresa tu contraseña"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
            Iniciar Sesión
        </button>
    </form>

    <div id="message" class="text-center p-3 rounded-lg hidden"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageElement = document.getElementById('message');

        messageElement.classList.add('hidden');

        const loginData = { email, password };
        const API_URL = 'http://localhost:8080/api/auth/login';

        fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(loginData)
        })
        .then(response => {
            if (response.ok) {
                return response.json();
            } else if (response.status === 401) {
                throw new Error("Credenciales Inválidas. Acceso Denegado.");
            } else {
                throw new Error(`Error en el servidor: HTTP ${response.status}`);
            }
        })
        .then(data => {
            // Éxito: Mostrar mensaje de éxito
            messageElement.textContent = `¡Inicio de sesión exitoso! (Rol: ${data.rol})`;
            messageElement.className = 'text-center p-3 rounded-lg text-green-700 bg-green-100';
            messageElement.classList.remove('hidden');

            // Guardar token y rol en localStorage
            localStorage.setItem('jwt-token', data.token);
            localStorage.setItem('userRole', data.rol);

            // Redirigir según el rol
            setTimeout(() => {
                if (data.rol === 'ROLE_ADMIN') {
                    window.location.href = '/admin.html';
                } else if (data.rol === 'ROLE_USER') {
                    window.location.href = '/index.html';
                } else {
                    throw new Error('Rol no reconocido');
                }
            }, 1500);
        })
        .catch(error => {
            // Error: Mostrar el mensaje de error
            messageElement.textContent = error.message;
            messageElement.className = 'text-center p-3 rounded-lg text-red-700 bg-red-100';
            messageElement.classList.remove('hidden');
        });
    });
</script>
</body>
</html>
