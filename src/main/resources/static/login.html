<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Estilo para que el fondo se vea bien */
        body {
            background-color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gray-50">

<div class="w-full max-w-md p-8 space-y-6 bg-white shadow-xl rounded-xl border border-gray-200">
    <h1 class="text-3xl font-extrabold text-center text-gray-900">🔐 Acceso Admin</h1>
    <p class="text-center text-sm text-gray-600">Ingresa tus credenciales de administrador para continuar.</p>

    <form id="loginForm" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="email" required placeholder="admin@tienda.com"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                   value="admin@tienda.com">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" id="password" required placeholder="••••••••"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                   value="admin123">
        </div>

        <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
            Iniciar Sesión
        </button>
    </form>

    <div id="message" class="text-center p-3 rounded-lg hidden"></div>
    <div id="tokenDisplay" class="text-sm break-all hidden p-3 bg-gray-100 rounded-lg border border-green-200">
        <p class="font-semibold text-green-700 mb-2">Token JWT Recibido:</p>
        <code id="jwtToken" class="text-xs text-gray-800"></code>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageElement = document.getElementById('message');
        const tokenDisplay = document.getElementById('tokenDisplay');
        const jwtTokenElement = document.getElementById('jwtToken');

        messageElement.classList.add('hidden');
        tokenDisplay.classList.add('hidden');

        const loginData = { email, password };

        // **********************************************
        // CLAVE: Corregido el puerto a 8080
        // **********************************************
        const API_URL = 'http://localhost:8080/api/auth/login';

        fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(loginData)
        })
        .then(response => {
            // Verificar si la respuesta es 200 (OK) o 401 (Unauthorized)
            if (response.ok) {
                return response.json();
            } else if (response.status === 401) {
                throw new Error("Credenciales Inválidas. Acceso Denegado.");
            } else {
                // Manejar otros errores HTTP (400, 500, etc.)
                throw new Error(`Error en el servidor: HTTP ${response.status}`);
            }
        })
        .then(data => {
            // Éxito: Mostrar el token y rol
            messageElement.textContent = `¡Inicio de sesión exitoso! (Rol: ${data.rol})`;
            messageElement.className = 'text-center p-3 rounded-lg text-green-700 bg-green-100';
            messageElement.classList.remove('hidden');

            // Mostrar el token para confirmación
            jwtTokenElement.textContent = data.token;
            tokenDisplay.classList.remove('hidden');

            // Aquí deberías guardar el token en localStorage y redirigir
            localStorage.setItem('jwtToken', data.token);
            localStorage.setItem('userRole', data.rol);

            // Redirigir automáticamente al panel admin si es ROLE_ADMIN
            if(data.rol === 'ROLE_ADMIN') {
                window.location.href = 'admin.html';
            } else {
                alert('No tiene permisos de administrador.');
            }
            // window.location.href = '/admin.html';
        })
        .catch(error => {
            // Error: Mostrar el mensaje de error
            messageElement.textContent = error.message;
            messageElement.className = 'text-center p-3 rounded-lg text-red-700 bg-red-100';
            messageElement.classList.remove('hidden');
        });
    });
</script>
</body>
</html>
